<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Instagram • 메세지</title>

  <link rel="stylesheet" href="../message-component/components/messeage-component.css" />
  <link rel="stylesheet" href="../sidebar/sidebar.css" />
  <link rel="stylesheet" href="messageLayout.css" />
  <link rel="stylesheet" href="messageList.css" />
  <link rel="stylesheet" href="messageChat.css" />
</head>

<body>
  <!--사이드바-->
  <div class="layout">
    <aside id="sidebar" class="sidebar"></aside>
    <main class="content"></main>
  </div>

  <!--dm 목록-->
  <section class="roomsLayout">
    <header class="rooms__header">
      <div class="rooms__header-row">
        <!--사용자 계정 이름-->
        <button class="rooms__user">
          <div>
            <h2>
              <span class="rooms__username">username</span>
            </h2>
          </div>
          <div>
            <svg aria-label="아래쪽 V자형 아이콘" class="user_change" fill="currentColor" height="12" role="img" viewBox="0 0 24 24" width="12">
              <title>아래쪽 V자형 아이콘</title>
              <path d="M12 17.502a1 1 0 0 1-.707-.293l-9-9.004a1 1 0 0 1 1.414-1.414L12 15.087l8.293-8.296a1 1 0 0 1 1.414 1.414l-9 9.004a1 1 0 0 1-.707.293Z" />
            </svg>
          </div>
        </button>

        <!--새 dm방 추가-->
        <button class="rooms__new" aria-label="New message">
          <svg aria-label="새로운 메시지" fill="currentColor" height="24" role="img" viewBox="0 0 24 24" width="24">
            <title>새로운 메시지</title>
            <path d="M12.202 3.203H5.25a3 3 0 0 0-3 3V18.75a3 3 0 0 0 3 3h12.547a3 3 0 0 0 3-3v-6.952" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" />
            <path d="M10.002 17.226H6.774v-3.228L18.607 2.165a1.417 1.417 0 0 1 2.004 0l1.224 1.225a1.417 1.417 0 0 1 0 2.004Z" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" />
            <line fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" x1="16.848" x2="20.076" y1="3.924" y2="7.153" />
          </svg>
        </button>
      </div>

      <!--dm 검색 창-->
      <div class="rooms__search">
        <label>
          <svg aria-label="검색" fill="currentColor" height="16" role="img" viewBox="0 0 24 24" width="16">
            <title>검색</title>
            <path d="M19 10.5A8.5 8.5 0 1 1 10.5 2a8.5 8.5 0 0 1 8.5 8.5Z" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" />
            <line fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"x1="16.511" x2="22" y1="16.511" y2="22" />
          </svg>
          <input type="search" placeholder="검색" />
        </label>
      </div>

      <!-- 메모 (구현 x) -->
      <div class="memo">

      </div>
    </header>

    <div class="rooms">
      <!-- dm 상단 "메세지" 타이틀-->
      <div class="rooms__title-row">
        <div class="rooms__title-message">메세지</div>
        <div id="message__request">요청</div>
      </div>
      <!-- dm 목록 -->
      <ul class="rooms__list">
        <li class="room">
          <img class="room__avatar" src="../assets/images/profile-img.png" alt="" />
          <div class="room__meta">
            <div class="room__name-row">
              <span class="room__name">Groom님</span>
              <span class="room__pinned">
                <svg aria-label="상단 고정" class="x1lliihq x1n2onr6 x1roi4f4" fill="currentColor" height="12" role="img" viewBox="0 0 24 24" width="12">
                  <title>상단 고정</title>
                  <path d="m22.707 7.583-6.29-6.29a1 1 0 0 0-1.414 0 5.183 5.183 0 0 0-1.543 3.593L8.172 8.79a5.161 5.161 0 0 0-4.768 1.42 1 1 0 0 0 0 1.414l3.779 3.778-5.89 5.89a1 1 0 1 0 1.414 1.414l5.89-5.89 3.778 3.779a1 1 0 0 0 1.414 0 5.174 5.174 0 0 0 1.42-4.769l3.905-5.287a5.183 5.183 0 0 0 3.593-1.543 1 1 0 0 0 0-1.414Z" />
                </svg>
              </span>
            </div>
            <div class="room__preview">
              <span class="room__lastChat">첨부 파일을 보냈습니다.</span>
              <span class="room__dot">•</span>
              <span class="room__time">20분</span>
            </div>
          </div>
        </li>

        <li class="room">
          <img class="room__avatar" src="../assets/images/avatar.png" alt="" />
          <div class="room__meta">
            <div class="room__name-row">
              <span class="room__name">백구름님</span>
            </div>
            <div class="room__preview">
              <span class="room__lastChat">머하니</span>
              <span class="room__dot">•</span>
              <span class="room__time">2시간</span>
            </div>
          </div>
          <span class="room__unread"></span>
        </li>
      </ul>
    </div>
  </section>

  <!--dm 화면-->
  <main class="main">
    <!-- 기본 빈 화면 -->
    <div class="empty" id="empty-state">
      <div class="empty__icon">
        <svg aria-label="" fill="currentColor" height="96" role="img" viewBox="0 0 96 96" width="96">
          <title></title>
          <circle cx="48" cy="48" fill="none" r="47" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" />
          <path d="m52.309 67.221 17.024-28.643c2.25-3.784-.478-8.578-4.88-8.578H31.55c-5.084 0-7.605 6.169-3.976 9.73l10.574 10.376 3.762 15.55c1.197 4.947 7.798 5.94 10.399 1.565Z" fill="none" stroke="currentColor" stroke-linejoin="round" stroke-width="2" />
          <line fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" x1="38.148" x2="55.675" y1="50.106" y2="40.134" />
        </svg>
      </div>
      <h2 class="empty__title">내 메시지</h2>
      <p class="empty__desc">친구나 그룹에 비공개 사진과 메시지를 보내보세요</p>
      <button class="empty__cta" type="button">메시지 보내기</button>
    </div>

    <!-- dm 화면 -->
    <div class="chat-room" id="chat-room" style="display: none;">

      <!-- dm방 상단 -->
      <div class="chat-header">
        <div class="chat-header__user">
          <img class="chat-header__avatar" src="../assets/images/avatar.png" alt="" />
          <div class="chat-header__userInfo">
            <span class="chat-header__name">사용자명</span>
            <span class="chat-header__userId">qna.da_</span>
          </div>
        </div>
        <div class="chat-header__buttons">
          <svg aria-label="음성 통화" fill="currentColor" height="24" role="img" viewBox="0 0 24 24" width="24">
            <title>음성 통화</title>
            <path d="M18.227 22.912c-4.913 0-9.286-3.627-11.486-5.828C4.486 14.83.731 10.291.921 5.231a3.289 3.289 0 0 1 .908-2.138 17.116 17.116 0 0 1 1.865-1.71 2.307 2.307 0 0 1 3.004.174 13.283 13.283 0 0 1 3.658 5.325 2.551 2.551 0 0 1-.19 1.941l-.455.853a.463.463 0 0 0-.024.387 7.57 7.57 0 0 0 4.077 4.075.455.455 0 0 0 .386-.024l.853-.455a2.548 2.548 0 0 1 1.94-.19 13.278 13.278 0 0 1 5.326 3.658 2.309 2.309 0 0 1 .174 3.003 17.319 17.319 0 0 1-1.71 1.866 3.29 3.29 0 0 1-2.138.91 10.27 10.27 0 0 1-.368.006Zm-13.144-20a.27.27 0 0 0-.167.054A15.121 15.121 0 0 0 3.28 4.47a1.289 1.289 0 0 0-.36.836c-.161 4.301 3.21 8.34 5.235 10.364s6.06 5.403 10.366 5.236a1.284 1.284 0 0 0 .835-.36 15.217 15.217 0 0 0 1.504-1.637.324.324 0 0 0-.047-.41 11.62 11.62 0 0 0-4.457-3.119.545.545 0 0 0-.411.044l-.854.455a2.452 2.452 0 0 1-2.071.116 9.571 9.571 0 0 1-5.189-5.188 2.457 2.457 0 0 1 .115-2.071l.456-.855a.544.544 0 0 0 .043-.41 11.629 11.629 0 0 0-3.118-4.458.36.36 0 0 0-.244-.1Z" />
          </svg>
          <svg aria-label="영상 통화" fill="currentColor" height="24" role="img" viewBox="0 0 24 24" width="24">
            <title>영상 통화</title>
            <rect fill="none" height="18" rx="3" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" width="16.999" x="1" y="3" />
            <path d="m17.999 9.146 2.495-2.256A1.5 1.5 0 0 1 23 8.003v7.994a1.5 1.5 0 0 1-2.506 1.113L18 14.854" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" />
          </svg>
          <svg aria-label="대화 정보" fill="currentColor" height="24" role="img" viewBox="0 0 24 24" width="24">
            <title>대화 정보</title>
            <circle cx="12.001" cy="12.005" fill="none" r="10.5" stroke="currentColor" stroke-linecap="round"stroke-linejoin="round" stroke-width="2" />
            <circle cx="11.819" cy="7.709" r="1.25" />
            <line fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"x1="10.569" x2="13.432" y1="16.777" y2="16.777" />
            <polyline fill="none" points="10.569 11.05 12 11.05 12 16.777" stroke="currentColor" stroke-linecap="round"stroke-linejoin="round" stroke-width="2" />
          </svg>

        </div>
      </div>

      <!-- dm 내용 -->
      <div class="chat-messages">
        <div class="message">
          <img class="message__avatar" src="../assets/images/avatar.png" alt="" />
          <div class="message__content">
            <span class="message__text">안녕하세요!</span>
          </div>
        </div>
      </div>

      <!-- dm 입력창-->
      <div class="chat-input">
        <svg aria-label="이모티콘 선택" fill="currentColor" height="24" role="img"
          viewBox="0 0 24 24" width="24">
          <title>이모티콘 선택</title>
          <path d="M15.83 10.997a1.167 1.167 0 1 0 1.167 1.167 1.167 1.167 0 0 0-1.167-1.167Zm-6.5 1.167a1.167 1.167 0 1 0-1.166 1.167 1.167 1.167 0 0 0 1.166-1.167Zm5.163 3.24a3.406 3.406 0 0 1-4.982.007 1 1 0 1 0-1.557 1.256 5.397 5.397 0 0 0 8.09 0 1 1 0 0 0-1.55-1.263ZM12 .503a11.5 11.5 0 1 0 11.5 11.5A11.513 11.513 0 0 0 12 .503Zm0 21a9.5 9.5 0 1 1 9.5-9.5 9.51 9.51 0 0 1-9.5 9.5Z" />
        </svg>
        <input id="chat-input-field" type="text" placeholder="메시지 입력..." />
        <div class="chat-inputType">
          <svg aria-label="음성 클립" fill="currentColor" height="24" role="img" viewBox="0 0 24 24" width="24">
            <title>음성 클립</title>
            <path d="M19.5 10.671v.897a7.5 7.5 0 0 1-15 0v-.897" fill="none" stroke="currentColor" stroke-linecap="round"stroke-linejoin="round" stroke-width="2" />
            <line fill="none" stroke="currentColor" stroke-linejoin="round" stroke-width="2" x1="12" x2="12" y1="19.068" y2="22" />
            <line fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" x1="8.706" x2="15.104" y1="22" y2="22" />
            <path d="M12 15.745a4 4 0 0 1-4-4V6a4 4 0 0 1 8 0v5.745a4 4 0 0 1-4 4Z" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" />
          </svg>
          <svg aria-label="사진 또는 동영상 추가"  fill="currentColor" height="24" role="img" viewBox="0 0 24 24" width="24">
            <title>사진 또는 동영상 추가</title>
            <path d="M6.549 5.013A1.557 1.557 0 1 0 8.106 6.57a1.557 1.557 0 0 0-1.557-1.557Z" fill-rule="evenodd" />
            <path d="m2 18.605 3.901-3.9a.908.908 0 0 1 1.284 0l2.807 2.806a.908.908 0 0 0 1.283 0l5.534-5.534a.908.908 0 0 1 1.283 0l3.905 3.905" fill="none" stroke="currentColor" stroke-linejoin="round" stroke-width="2" />
            <path d="M18.44 2.004A3.56 3.56 0 0 1 22 5.564h0v12.873a3.56 3.56 0 0 1-3.56 3.56H5.568a3.56 3.56 0 0 1-3.56-3.56V5.563a3.56 3.56 0 0 1 3.56-3.56Z" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" />
          </svg>
          <svg aria-label="GIF 또는 스티커를 선택하세요" fill="currentColor" height="24" role="img" viewBox="0 0 24 24" width="24">
            <title>GIF 또는 스티커를 선택하세요</title>
            <path d="M13.11 22H7.416A5.417 5.417 0 0 1 2 16.583V7.417A5.417 5.417 0 0 1 7.417 2h9.166A5.417 5.417 0 0 1 22 7.417v5.836a2.083 2.083 0 0 1-.626 1.488l-6.808 6.664A2.083 2.083 0 0 1 13.11 22Z" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" />
            <circle cx="8.238" cy="9.943" r="1.335" />
            <circle cx="15.762" cy="9.943" r="1.335" />
            <path d="M15.174 15.23a4.887 4.887 0 0 1-6.937-.301" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" />
            <path d="M22 10.833v1.629a1.25 1.25 0 0 1-1.25 1.25h-1.79a5.417 5.417 0 0 0-5.417 5.417v1.62a1.25 1.25 0 0 1-1.25 1.25H9.897" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" />
          </svg>
        </div>
        <button id="chat-send-btn" type="button" aria-hidden="true">보내기</button>
      </div>

    </div>
  </main>

  <script src="message.js"></script>
  <script src="../sidebar/sidebar.js"></script>
  <script src="../message-component/components/message-component.js"></script>
</body>
