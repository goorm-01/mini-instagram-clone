<svg xmlns="http://www.w3.org/2000/svg" style="display: none;">
  
  <!-- 메시지 아이콘 -->
  <symbol id="icon-message" viewBox="0 0 24 24">
    <title>메시지</title>
    <path d="M13.973 20.046 21.77 6.928C22.8 5.195 21.55 3 19.535 3H4.466C2.138 3 .984 5.825 2.646 7.456l4.842 4.752 1.723 7.121c.548 2.266 3.571 2.721 4.762.717Z" 
          fill="none" 
          stroke="currentColor" 
          stroke-linejoin="round" 
          stroke-width="2"/>
    <line fill="none" 
          stroke="currentColor" 
          stroke-linecap="round" 
          stroke-linejoin="round" 
          stroke-width="2" 
          x1="7.488" 
          x2="15.515" 
          y1="12.208" 
          y2="7.641"/>
  </symbol>

  <!-- 탐색 아이콘 -->
  <symbol id="icon-explore" viewBox="0 0 24 24">
    <title>탐색</title>
    <polygon fill="none" 
             points="13.941 13.953 7.581 16.424 10.06 10.056 16.42 7.585 13.941 13.953" 
             stroke="currentColor" 
             stroke-linecap="round" 
             stroke-linejoin="round" 
             stroke-width="2"/>
    <polygon fill-rule="evenodd" 
             points="10.06 10.056 13.949 13.945 7.581 16.424 10.06 10.056"/>
    <circle cx="12.001" 
            cy="12.005" 
            fill="none" 
            r="10.5" 
            stroke="currentColor" 
            stroke-linecap="round" 
            stroke-linejoin="round" 
            stroke-width="2"/>
  </symbol>

  <!-- 닫기 아이콘 -->
  <symbol id="icon-close" viewBox="0 0 24 24">
    <title>닫기</title>
    <line fill="none" 
          stroke="currentColor" 
          stroke-linecap="round" 
          stroke-linejoin="round" 
          stroke-width="2" 
          x1="21" 
          x2="3" 
          y1="3" 
          y2="21"/>
    <line fill="none" 
          stroke="currentColor" 
          stroke-linecap="round" 
          stroke-linejoin="round" 
          stroke-width="2" 
          x1="21" 
          x2="3" 
          y1="21" 
          y2="3"/>
  </symbol>

  <!-- 전송 아이콘 -->
  <symbol id="icon-send" viewBox="0 0 24 24">
    <title>전송</title>
    <line fill="none" 
          stroke="currentColor" 
          stroke-linejoin="round" 
          stroke-width="2" 
          x1="22" 
          x2="9.218" 
          y1="3" 
          y2="10.083"/>
    <polygon fill="none" 
            points="11.698 20.334 22 3.001 2 3.001 9.218 10.084 11.698 20.334" 
            stroke="currentColor" 
            stroke-linejoin="round" 
            stroke-width="2"/>
  </symbol>

  <!-- 펼쳐보기 아이콘 -->
  <symbol id="icon-expand" viewBox="0 0 24 24">
    <title>펼쳐보기</title>
    <path d="M10 20H4v-6a1 1 0 0 0-2 0v7a1 1 0 0 0 1 1h7a1 1 0 0 0 0-2ZM20.999 2H14a1 1 0 0 0 0 2h5.999v6a1 1 0 0 0 2 0V3a1 1 0 0 0-1-1Z" 
          fill="currentColor"/>
  </symbol>

  <symbol id="icon-new-message" viewBox="0 0 24 24">
    <title>새 메시지</title>
    <path d="M12.202 3.203H5.25a3 3 0 0 0-3 3V18.75a3 3 0 0 0 3 3h12.547a3 3 0 0 0 3-3v-6.952" 
          fill="none" 
          stroke="currentColor" 
          stroke-linecap="round" 
          stroke-linejoin="round" 
          stroke-width="2"/>
    <path d="M10.002 17.226H6.774v-3.228L18.607 2.165a1.417 1.417 0 0 1 2.004 0l1.224 1.225a1.417 1.417 0 0 1 0 2.004Z" 
          fill="none" 
          stroke="currentColor" 
          stroke-linecap="round" 
          stroke-linejoin="round" 
          stroke-width="2"/>
    <line fill="none" 
          stroke="currentColor" 
          stroke-linecap="round" 
          stroke-linejoin="round" 
          stroke-width="2" 
          x1="16.848" 
          x2="20.076" 
          y1="3.924" 
          y2="7.153"/>
  </symbol>

  <!-- 돌아가기 아이콘 (뒤로 가기) -->
  <symbol id="icon-back" viewBox="0 0 24 24">
    <title>돌아가기</title>
    <polyline fill="none" 
              points="16.502 3 7.498 12 16.502 21" 
              stroke="currentColor" 
              stroke-linecap="round" 
              stroke-linejoin="round" 
              stroke-width="2"/>
  </symbol>

  <!-- 체크 아이콘 -->
<symbol id="icon-check" viewBox="0 0 24 24">
  <title>체크</title>
  <polyline fill="none" 
            points="20 6 9 17 4 12" 
            stroke="currentColor" 
            stroke-linecap="round" 
            stroke-linejoin="round" 
            stroke-width="3"/>
</symbol>

</svg>